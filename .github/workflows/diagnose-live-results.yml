name: Diagnose Live Results

on:
  workflow_dispatch:
    inputs:
      worker_url:
        description: Worker URL to inspect.
        required: true
        default: https://world-cup-2026-atlas.audiostakes.workers.dev
        type: string
      run_provider_poll:
        description: Run API-FOOTBALL polling and write remote RESULTS_KV. Consumes request count.
        required: true
        default: false
        type: boolean
      now:
        description: Optional ISO timestamp for the provider polling decision.
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: live-results-diagnostics
  cancel-in-progress: false

jobs:
  diagnose:
    name: Diagnose Live Results
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Enable Corepack
        run: corepack enable

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20.19.0
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run focused checks
        run: |
          pnpm typecheck
          pnpm test workers/results/src/poll.test.ts workers/results/src/apiFootball.test.ts src/matchResults/pollingPolicy.test.ts

      - name: Diagnose current live results
        run: pnpm diagnose:live-results -- --worker-url "$WORKER_URL"
        env:
          WORKER_URL: ${{ inputs.worker_url }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Run provider poll and write RESULTS_KV
        if: ${{ inputs.run_provider_poll }}
        run: |
          set -euo pipefail

          args=(--remote-kv --allow-provider-request --write-kv)

          if [ -n "$PROVIDER_POLL_NOW" ]; then
            args+=(--now "$PROVIDER_POLL_NOW")
          fi

          pnpm poll:live-results -- "${args[@]}"
        env:
          PROVIDER_POLL_NOW: ${{ inputs.now }}
          API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Diagnose live results after provider poll
        if: ${{ inputs.run_provider_poll }}
        run: pnpm diagnose:live-results -- --worker-url "$WORKER_URL"
        env:
          WORKER_URL: ${{ inputs.worker_url }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
