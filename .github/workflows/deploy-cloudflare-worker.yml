name: Deploy Cloudflare Worker

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cloudflare-worker
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy Cloudflare Worker
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Enable Corepack
        run: corepack enable

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20.19.0
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run quality gate
        run: pnpm verify

      - name: Deploy Worker
        id: deploy
        run: |
          set -euo pipefail

          pnpm wrangler deploy --config wrangler.toml 2>&1 | tee wrangler-deploy.log
          worker_url="$(grep -Eo 'https://[A-Za-z0-9.-]+\.workers\.dev' wrangler-deploy.log | tail -n 1 || true)"

          if [ -n "$worker_url" ]; then
            echo "worker_url=$worker_url" >> "$GITHUB_OUTPUT"
          else
            echo "Worker URL was not found in wrangler deploy output; skipping automated smoke check."
          fi
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Smoke check /api/results
        if: steps.deploy.outputs.worker_url != ''
        run: |
          set -euo pipefail

          curl --fail --silent --show-error --location \
            --header "Accept: application/json" \
            "$WORKER_URL/api/results" \
            --output /tmp/results.json

          node -e 'const fs = require("node:fs"); const data = JSON.parse(fs.readFileSync("/tmp/results.json", "utf8")); if (!data || typeof data !== "object" || !Array.isArray(data.matches)) { throw new Error("Expected /api/results JSON snapshot with matches array"); }'
        env:
          WORKER_URL: ${{ steps.deploy.outputs.worker_url }}
